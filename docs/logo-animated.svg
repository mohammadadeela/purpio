<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Purpio" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect x="32" y="32" width="448" height="448" rx="118"/></clipPath>
    <style>
      .draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw .9s cubic-bezier(.65,0,.2,1) .15s forwards}
      .stem{transform-origin:256px 352px;transform:scaleY(0);animation:rise .5s cubic-bezier(.2,.8,.2,1) .05s forwards}
      .spark{opacity:0;animation:pop .5s ease-out 1s forwards, twinkle 4s ease-in-out 1.6s infinite}
      .sheen{animation:sweep 4s ease-in-out 1.4s infinite}
      .tileg{animation:breathe 4s ease-in-out 1.2s infinite}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes rise{to{transform:scaleY(1)}}
      @keyframes pop{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
      @keyframes twinkle{0%,100%{opacity:1}50%{opacity:.55}}
      @keyframes sweep{0%{transform:translateX(-520px)}35%{transform:translateX(520px)}100%{transform:translateX(520px)}}
      @keyframes breathe{0%,100%{filter:drop-shadow(0 0 0 rgba(124,58,237,0))}50%{filter:drop-shadow(0 0 28px rgba(124,58,237,.55))}}
      @media (prefers-reduced-motion:reduce){.draw,.stem,.spark,.sheen,.tileg{animation:none;stroke-dashoffset:0;transform:none;opacity:1}}
    </style>
  </defs>
  <g class="tileg">
    <rect x="32" y="32" width="448" height="448" rx="118" fill="url(#g)"/>
    <g clip-path="url(#tile)"><rect class="sheen" x="-120" y="0" width="260" height="512" fill="url(#sheen)" transform="skewX(-18)"/></g>
  </g>
  <!-- P: stem -->
  <rect class="stem" x="150" y="128" width="52" height="256" rx="26" fill="#fff"/>
  <!-- P: bowl drawn as a stroke, its tip becomes a cursor arrow -->
  <path class="draw" d="M176 154 H290 a76 76 0 0 1 0 152 H176" fill="none" stroke="#fff" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- cursor / spark -->
  <g class="spark" style="transform-origin:372px 352px" filter="url(#glow)">
    <path d="M352 318 L404 344 L378 352 L390 382 L372 388 L362 360 L344 376 Z" fill="#fff"/>
  </g>
</svg>
